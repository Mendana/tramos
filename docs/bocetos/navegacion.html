<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Boceto navegable de la navegación de la app (#105 y #119). Datos inventados: ningún nombre,
     carrera ni número es real. Se abre en el navegador; no forma parte de la app. -->
<title>Boceto de Tramos</title>
<style>
/* Layout: barra lateral oscura fija con las secciones; a la derecha, cabecera con migas y contexto
   y el contenido sobre un fondo cálido. Las tarjetas se reservan para paneles y cifras. */
:root {
  --bg: #f3f1ed;
  --surface: #ffffff;
  --surface-2: #f8f7f4;
  --hover: #efece6;
  --border: #e2ded6;
  --border-strong: #cbc5ba;
  --text: #1d1b18;
  --muted: #67615a;
  --faint: #958f85;

  --accent: #a8236f;
  --accent-hover: #8e1d5e;
  --accent-soft: #f6e6ef;
  --on-accent: #ffffff;

  --error: #c9530a;
  --error-soft: #fdeee2;
  --success: #2c7a4b;
  --success-soft: #e4f2e9;
  --info: #2f5f8f;
  --info-soft: #e7eff8;
  --warning: #8f6400;
  --warning-soft: #faf1d9;

  --side-bg: #1b1e22;
  --side-text: #d3d7dc;
  --side-muted: #8a929b;
  --side-hover: #262a30;
  --side-active: #33212d;
  --side-line: #2c3036;

  --chart-1: #a8236f;
  --chart-2: #2a78d6;
  --chart-3: #199e70;
  --chart-4: #c98500;
  --chart-error: #d4580b;
  --chart-muted: #8a8479;
  --chart-grid: #ebe8e2;
  --chart-axis: #cfc9bd;
  --chart-ref: #6b655c;
  --chart-gain: #2a78b8;

  /* El mapa es claro en los dos modos (como las teselas de OSM). */
  --map-paper: #f2efe9;
  --map-forest: #d7ead0;
  --map-open: #f6e7b4;
  --map-contour: #c79a6b;
  --map-water: #a9d3ee;
  --map-casing: #ffffff;
  --seq-1: #6da7ec;
  --seq-2: #3987e5;
  --seq-3: #256abf;
  --seq-4: #184f95;
  --seq-5: #0d366b;

  --note-bg: #fff6c4;
  --note-border: #e2cd5f;
  --note-text: #4a4120;

  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Ubuntu, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, monospace;
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow: 0 1px 2px rgb(31 28 24 / 6%), 0 1px 1px rgb(31 28 24 / 4%);
  --shadow-raised: 0 10px 30px rgb(31 28 24 / 16%);
  --focus: 0 0 0 3px rgb(168 35 111 / 32%);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #141312; --surface: #1d1c1a; --surface-2: #191816; --hover: #262422;
    --border: #312e2a; --border-strong: #45413b;
    --text: #edeae4; --muted: #a8a197; --faint: #79736a;
    --accent: #e66db5; --accent-hover: #f08cc7; --accent-soft: #3a1f30; --on-accent: #1d0d17;
    --error: #f28a45; --error-soft: #3a2416; --success: #6cc690; --success-soft: #1a3324;
    --info: #86b4e3; --info-soft: #1b2a3a; --warning: #e0b23e; --warning-soft: #352b14;
    --side-bg: #0e0f11; --side-text: #d3d7dc; --side-muted: #7d858e; --side-hover: #1a1c20;
    --side-active: #2e1b28; --side-line: #22252a;
    --chart-1: #d45ca3; --chart-2: #3987e5; --chart-3: #0f8f62; --chart-4: #c98500;
    --chart-error: #dc7430; --chart-muted: #7a756c; --chart-grid: #2a2826; --chart-axis: #45413b;
    --chart-ref: #a8a197; --chart-gain: #4f95d0;
    --note-bg: #3a3415; --note-border: #6b5d1f; --note-text: #f1e6b0;
    --shadow: 0 1px 2px rgb(0 0 0 / 40%); --shadow-raised: 0 10px 30px rgb(0 0 0 / 55%);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141312; --surface: #1d1c1a; --surface-2: #191816; --hover: #262422;
  --border: #312e2a; --border-strong: #45413b;
  --text: #edeae4; --muted: #a8a197; --faint: #79736a;
  --accent: #e66db5; --accent-hover: #f08cc7; --accent-soft: #3a1f30; --on-accent: #1d0d17;
  --error: #f28a45; --error-soft: #3a2416; --success: #6cc690; --success-soft: #1a3324;
  --info: #86b4e3; --info-soft: #1b2a3a; --warning: #e0b23e; --warning-soft: #352b14;
  --side-bg: #0e0f11; --side-text: #d3d7dc; --side-muted: #7d858e; --side-hover: #1a1c20;
  --side-active: #2e1b28; --side-line: #22252a;
  --chart-1: #d45ca3; --chart-2: #3987e5; --chart-3: #0f8f62; --chart-4: #c98500;
  --chart-error: #dc7430; --chart-muted: #7a756c; --chart-grid: #2a2826; --chart-axis: #45413b;
  --chart-ref: #a8a197; --chart-gain: #4f95d0;
  --note-bg: #3a3415; --note-border: #6b5d1f; --note-text: #f1e6b0;
  --shadow: 0 1px 2px rgb(0 0 0 / 40%); --shadow-raised: 0 10px 30px rgb(0 0 0 / 55%);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; line-height: 1.25; }
h1 { font-size: 24px; font-weight: 680; letter-spacing: -0.01em; }
h2 { font-size: 17px; font-weight: 650; }
h3 { font-size: 15px; font-weight: 640; }
p { margin: 0; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12.5px; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--radius-sm); }

/* ---------- Estructura ---------- */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side {
  background: var(--side-bg); color: var(--side-text); display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; padding: 16px 12px; gap: 4px; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.brand-name { font-size: 17px; font-weight: 700; letter-spacing: 0.01em; color: #fff; }
.side-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--side-muted);
  padding: 14px 10px 6px; display: flex; justify-content: space-between; align-items: center;
}
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0;
  background: none; border-radius: 8px; cursor: pointer; text-align: left; color: var(--side-text);
}
.nav-item:hover { background: var(--side-hover); }
.nav-item.active { background: var(--side-active); color: #fff; box-shadow: inset 3px 0 0 #e66db5; }
.nav-item svg { flex: none; opacity: 0.85; }
.nav-item .count {
  margin-left: auto; font-size: 11.5px; background: #e66db5; color: #1d0d17; border-radius: 99px;
  padding: 0 7px; font-weight: 650;
}
.nav-sub { padding-left: 22px; display: grid; gap: 2px; }
.nav-sub .nav-item { padding: 6px 10px; font-size: 13.5px; }
.athlete-picker {
  margin: 2px 4px 6px; display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  border: 1px solid var(--side-line); border-radius: 8px; background: var(--side-hover); cursor: pointer;
  color: var(--side-text); width: calc(100% - 8px); text-align: left;
}
.side-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--side-line);
  font-size: 12px; color: var(--side-muted); display: grid; gap: 4px; }
.sync-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #6cc690; margin-right: 6px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; padding: 10px 28px; min-height: 56px;
}
.crumbs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; font-size: 13.5px; }
.crumbs button { border: 0; background: none; padding: 2px 4px; border-radius: 6px; cursor: pointer; color: var(--muted); }
.crumbs button:hover { background: var(--hover); color: var(--text); }
.crumbs .here { font-weight: 600; color: var(--text); }
.topbar .spacer { flex: 1; }
.menu-btn { display: none; }
.content { padding: 24px 28px 64px; max-width: 1240px; width: 100%; display: grid; gap: 20px; align-content: start; }

.viewing-banner {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--info-soft);
  border: 1px solid color-mix(in srgb, var(--info) 35%, transparent); color: var(--text);
  padding: 10px 14px; border-radius: var(--radius);
}
.viewing-banner strong { color: var(--info); }

/* ---------- Piezas ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong);
  background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { border-color: transparent; background: none; }
.btn-sm { padding: 4px 9px; font-size: 13px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head .grow { flex: 1; min-width: 240px; display: grid; gap: 4px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
.card-pad { padding: 18px 20px; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 0; flex-wrap: wrap; }
.card-head h3 { flex: 1; min-width: 160px; }
.card-body { padding: 12px 18px 16px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.pill {
  display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600;
  padding: 1px 8px; border-radius: 99px; background: var(--hover); color: var(--muted); white-space: nowrap;
}
.pill-sprint { background: #e7eff8; color: #2f5f8f; }
.pill-media { background: #e4f2e9; color: #2c6b45; }
.pill-larga { background: #f6e6ef; color: #8e1d5e; }
.pill-error { background: var(--error-soft); color: var(--error); }
.pill-ok { background: var(--success-soft); color: var(--success); }
.pill-info { background: var(--info-soft); color: var(--info); }
.pill-warn { background: var(--warning-soft); color: var(--warning); }
:root[data-theme="dark"] .pill-sprint { background: #1b2a3a; color: #86b4e3; }
:root[data-theme="dark"] .pill-media { background: #1a3324; color: #6cc690; }
:root[data-theme="dark"] .pill-larga { background: #3a1f30; color: #e66db5; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .pill-sprint { background: #1b2a3a; color: #86b4e3; }
  :root:not([data-theme="light"]) .pill-media { background: #1a3324; color: #6cc690; }
  :root:not([data-theme="light"]) .pill-larga { background: #3a1f30; color: #e66db5; }
}

.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 11px; cursor: pointer; font-size: 13px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--border-strong); background: var(--surface); border-radius: 99px;
  padding: 4px 12px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
}
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

.input, .select {
  border: 1px solid var(--border-strong); background: var(--surface); border-radius: 8px; padding: 7px 10px;
  min-width: 0;
}
.search { position: relative; flex: 1 1 220px; max-width: 340px; }
.search .input { width: 100%; padding-left: 32px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toolbar .grow { flex: 1; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab {
  border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--muted); white-space: nowrap;
  border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 550;
}
.tab:hover { color: var(--text); }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.tab .badge { margin-left: 6px; font-size: 11px; background: var(--error-soft); color: var(--error); border-radius: 99px; padding: 0 6px; }

/* Cifras */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 2px; }
.kpi .label { font-size: 12px; color: var(--muted); }
.kpi .value { font-size: 24px; font-weight: 680; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.kpi.error .value { color: var(--error); }
.up { color: var(--success); }
.down { color: var(--error); }

/* Tablas */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--hover); }
tr.err td { background: color-mix(in srgb, var(--error-soft) 70%, transparent); }
tr.sel td { background: var(--accent-soft); }
.race-name { font-weight: 600; }
.pager { display: flex; align-items: center; gap: 8px; justify-content: space-between; padding: 12px 4px 0; flex-wrap: wrap; }

/* Paneles de análisis */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); display: flex; flex-direction: column; min-width: 0; }
.panel-head { display: flex; align-items: flex-start; gap: 8px; padding: 14px 16px 4px; }
.panel-head .t { flex: 1; min-width: 0; display: grid; gap: 2px; }
.panel-head .q { font-size: 12px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.panel-body { padding: 6px 16px 14px; display: grid; gap: 8px; }
.panel-read { font-size: 13px; color: var(--muted); }
.icon-btn { border: 0; background: none; padding: 4px; border-radius: 6px; cursor: pointer; color: var(--muted); display: inline-flex; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.panel.wide { grid-column: 1 / -1; }
.panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.panel-menu { position: relative; }
.menu {
  position: absolute; right: 0; top: 30px; z-index: 30; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: var(--shadow-raised); padding: 6px; min-width: 190px; display: grid;
}
.menu button { border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.menu button:hover { background: var(--hover); }

/* Gráficas */
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--chart-grid); stroke-width: 1; }
.chart .axis { stroke: var(--chart-axis); stroke-width: 1; }
.chart .ref { stroke: var(--chart-ref); stroke-width: 1.5; stroke-dasharray: 4 4; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart text.strong { fill: var(--text); font-weight: 600; }
.chart .bar { fill: var(--chart-1); }
.chart .bar.muted { fill: var(--chart-muted); }
.chart .bar.err { fill: var(--chart-error); }
.chart .bar.gain { fill: var(--chart-gain); }
.chart .bar.s2 { fill: var(--chart-2); }
.chart .bar.s3 { fill: var(--chart-3); }
.chart .bar.s4 { fill: var(--chart-4); }
.chart .bar:hover { opacity: 0.8; }
.chart .line { fill: none; stroke: var(--chart-1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .line.s2 { stroke: var(--chart-2); }
.chart .line.s3 { stroke: var(--chart-3); }
.chart .line.s4 { stroke: var(--chart-4); }
.chart .line.thick { stroke-width: 3; }
.chart .area { fill: var(--chart-1); opacity: 0.1; }
.chart .mark { fill: var(--chart-1); stroke: var(--surface); stroke-width: 2; }
.chart .mark.err { fill: var(--chart-error); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.sw-1 { background: var(--chart-1); } .sw-2 { background: var(--chart-2); } .sw-3 { background: var(--chart-3); }
.sw-4 { background: var(--chart-4); } .sw-err { background: var(--chart-error); } .sw-muted { background: var(--chart-muted); }
.sw-gain { background: var(--chart-gain); }
.spark { width: 120px; height: 34px; }
.spark .line { stroke-width: 1.75; }

/* Mapa */
.map-box { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); background: var(--map-paper); position: relative; }
.map-box svg { display: block; width: 100%; height: auto; }
.map-legend { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.map-scale { display: inline-flex; border-radius: 4px; overflow: hidden; background: var(--map-paper); padding: 3px; }
.map-scale i { width: 26px; height: 10px; display: block; }
.map-tools { position: absolute; right: 10px; top: 10px; display: grid; gap: 4px; }
.map-tools button { width: 30px; height: 30px; border-radius: 7px; border: 1px solid #cfc9bd; background: #fff; color: #1d1b18; cursor: pointer; }
.attrib { position: absolute; right: 6px; bottom: 4px; font-size: 10.5px; color: #4a453e; background: rgb(255 255 255 / 75%); padding: 0 5px; border-radius: 4px; }
.leg-list { display: grid; gap: 2px; max-height: 420px; overflow: auto; }
.leg-item { display: grid; grid-template-columns: 42px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; cursor: pointer; border: 0; background: none; text-align: left; }
.leg-item:hover { background: var(--hover); }
.leg-item.on { background: var(--accent-soft); }

/* Avisos, notas y vacíos */
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: var(--radius); background: var(--info-soft); color: var(--text); }
.notice.warn { background: var(--warning-soft); }
.notice.err { background: var(--error-soft); }
.notice svg { flex: none; margin-top: 2px; }
.note {
  background: var(--note-bg); border: 1px dashed var(--note-border); color: var(--note-text);
  border-radius: var(--radius); padding: 10px 14px; font-size: 13px; display: flex; gap: 10px;
}
.note b { font-weight: 700; }
.note::before { content: "✎"; font-weight: 700; }
body.no-notes .note { display: none; }
.empty { text-align: center; padding: 40px 20px; display: grid; gap: 10px; justify-items: center; color: var(--muted); }

/* Tareas y listas */
.task { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.task:last-child { border-bottom: 0; }
.task .ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.task .ico.e { background: var(--error-soft); color: var(--error); }
.task .ico.i { background: var(--info-soft); color: var(--info); }
.task .ico.a { background: var(--accent-soft); color: var(--accent); }
.task .grow { flex: 1; min-width: 0; }

.hero-race { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 0; overflow: hidden; }

    else d = "M" + (cx - bw / 2) + "," + top + "V" + (top + h - rr) + "Q" + (cx - bw / 2) + "," + (top + h) + " " + (cx - bw / 2 + rr) + "," + (top + h) + "H" + (cx + bw / 2 - rr) + "Q" + (cx + bw / 2) + "," + (top + h) + " " + (cx + bw / 2) + "," + (top + h - rr) + "V" + top + "Z";
    s += '<path class="bar ' + cls + '" d="' + d + '"><title>' + esc(opts.labels[i] + ": " + fmt(v)) + "</title></path>";
    if (n <= 14 || i % 2 === 0) s += '<text x="' + cx + '" y="' + (H - B + 16) + '" text-anchor="middle">' + esc(opts.labels[i]) + "</text>";
    if (opts.n) s += '<text x="' + cx + '" y="' + (H - B + 31) + '" text-anchor="middle" class="faint">n = ' + opts.n[i] + "</text>";
  });
  if (opts.ref != null) {

    s += '<text class="strong" x="' + (W - R) + '" y="' + (y(opts.ref) - 6) + '" text-anchor="end">' + esc(opts.refLabel || "") + "</text>";

function lines(opts) {
  // opts: labels, series: [{values, cls, name, thick}], ref, refLabel, fmt, min, max, marks
  const W = 560, H = 210, L = 44, R = opts.endLabels ? 70 : 12, T = 14, B = 30;
  const all = [];
  opts.series.forEach(function (s) { all.push.apply(all, s.values); });
  const hi = Math.max.apply(null, all.concat(opts.ref == null ? -Infinity : opts.ref));
  const lo = Math.min.apply(null, all.concat(opts.ref == null ? Infinity : opts.ref));
  const pad = (hi - lo || 1) * 0.06;
  const max = opts.max != null ? opts.max : hi + pad;
  const min = opts.min != null ? opts.min : lo - pad;
  const n = opts.labels.length;
  const x = function (i) { return L + (W - L - R) * (n === 1 ? 0.5 : i / (n - 1)); };
  const y = function (v) { return T + (H - T - B) * (1 - (v - min) / (max - min)); };
  const fmt = opts.fmt || function (v) { return fnum(v, 0); };
  let s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(opts.title || "Gráfica") + '">';
  for (let k = 0; k <= 4; k++) {
    const v = min + (max - min) * k / 4;
    s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>';
    s += '<text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + fmt(v) + "</text>";
  }
  const step = Math.ceil(n / 8);
  opts.labels.forEach(function (lab, i) {
    if (i % step === 0 || i === n - 1) s += '<text x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(lab) + "</text>";
  });
  if (opts.ref != null) {
    s += '<line class="ref" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(opts.ref) + '" y2="' + y(opts.ref) + '"/>';
    s += '<text class="strong" x="' + (L + 6) + '" y="' + (y(opts.ref) - 6) + '">' + esc(opts.refLabel || "") + "</text>";
  }
  opts.series.forEach(function (ser, si) {
    const pts = ser.values.map(function (v, i) { return x(i) + "," + y(v); }).join(" ");
    if (si === 0 && opts.area) s += '<polygon class="area" points="' + x(0) + "," + y(min) + " " + pts + " " + x(n - 1) + "," + y(min) + '"/>';
    s += '<polyline class="line ' + (ser.cls || "") + (ser.thick ? " thick" : "") + '" points="' + pts + '"/>';
    if (opts.marks && si === 0) ser.values.forEach(function (v, i) {
      s += '<circle class="mark' + (opts.markErr && opts.markErr(i) ? " err" : "") + '" cx="' + x(i) + '" cy="' + y(v) + '" r="4"><title>' + esc(opts.labels[i] + ": " + fmt(v)) + "</title></circle>";
    });
    if (opts.endLabels) s += '<text class="strong" x="' + (x(n - 1) + 8) + '" y="' + (y(ser.values[n - 1]) + 4) + '">' + esc(ser.name) + "</text>";
  });
  return s + "</svg>";
}
function spark(values, cls) {
  const W = 120, H = 34, min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  const pts = values.map(function (v, i) { return (2 + (W - 4) * i / (values.length - 1)) + "," + (3 + (H - 6) * (1 - (v - min) / ((max - min) || 1))); });
  const last = pts[pts.length - 1].split(",");
  return '<svg class="chart spark" viewBox="0 0 ' + W + " " + H + '" aria-hidden="true"><polyline class="line ' + (cls || "") + '" points="' + pts.join(" ") + '"/><circle class="mark" cx="' + last[0] + '" cy="' + last[1] + '" r="3"/></svg>';
}

function fakeMap(race, opts) {
  opts = opts || {};
  const W = 640, H = opts.h || 400;
  const r = rng(race.id.charCodeAt(1) * 31 + 3);
  let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Mapa de la carrera con el recorrido">';
  s += '<rect width="' + W + '" height="' + H + '" fill="#f2efe9"/>';
  for (let k = 0; k < 5; k++) {
    const cx = r() * W, cy = r() * H, rx = 60 + r() * 140, ry = 40 + r() * 100;
    s += '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="' + (k % 3 === 2 ? "#f6e7b4" : "#d7ead0") + '"/>';
  }
  s += '<path d="M' + (W * 0.7) + ",0 C" + (W * 0.66) + "," + (H * 0.3) + " " + (W * 0.82) + "," + (H * 0.5) + " " + (W * 0.78) + "," + H + '" stroke="#a9d3ee" stroke-width="7" fill="none"/>';
  for (let k = 0; k < 3; k++) {
    const cx = 120 + r() * (W - 240), cy = 90 + r() * (H - 180);
    for (let j = 1; j <= 4; j++) {
      const rx = 24 * j + r() * 10, ry = 16 * j + r() * 8;
      s += '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" transform="rotate(' + Math.round(r() * 60 - 30) + " " + cx + " " + cy + ')" fill="none" stroke="#c79a6b" stroke-width="1" opacity="0.8"/>';
    }
  }
  // Balizas
  const nCtl = opts.controls || race.legs;
  const pts = [];
  let px = 70 + r() * 80, py = H - 70 - r() * 60;
  for (let i = 0; i <= nCtl; i++) {
    pts.push([px, py]);
    const ang = r() * Math.PI * 2;
    const step = 55 + r() * 60;
    px = Math.max(40, Math.min(W - 40, px + Math.cos(ang) * step));
    py = Math.max(40, Math.min(H - 40, py + Math.sin(ang) * step));
  }
  const seqs = ["#6da7ec", "#3987e5", "#256abf", "#184f95", "#0d366b"];
  const sel = opts.selected;
  let track = "";
  for (let i = 0; i < nCtl; i++) {
    const a = pts[i], b = pts[i + 1];
    const segs = 6;
    let prev = a;
    for (let k = 1; k <= segs; k++) {
      const t = k / segs;
      const wob = (opts.errLegs && opts.errLegs.has(i + 1) && k > 1 && k < segs) ? 28 : 7;
      const p = k === segs ? b : [a[0] + (b[0] - a[0]) * t + (r() - 0.5) * wob, a[1] + (b[1] - a[1]) * t + (r() - 0.5) * wob];
      const cls = Math.min(4, Math.floor(r() * 3 + (opts.errLegs && opts.errLegs.has(i + 1) ? 2 : 0)));
      const dim = sel && sel !== i + 1;
      track += '<line x1="' + prev[0] + '" y1="' + prev[1] + '" x2="' + p[0] + '" y2="' + p[1] + '" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" opacity="' + (dim ? 0.35 : 1) + '"/>';
      track += '<line x1="' + prev[0] + '" y1="' + prev[1] + '" x2="' + p[0] + '" y2="' + p[1] + '" stroke="' + seqs[cls] + '" stroke-width="4" stroke-linecap="round" opacity="' + (dim ? 0.3 : 1) + '"/>';
      prev = p;
    }
    if (sel === i + 1) track += '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '" stroke="#a8236f" stroke-width="14" stroke-linecap="round" opacity="0.18"/>';
  }
  s += track;
  for (let i = 0; i < nCtl; i++) {
    const a = pts[i], b = pts[i + 1];
    s += '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '" stroke="#a8236f" stroke-width="1.4" opacity="0.55"/>';
  }
  pts.forEach(function (p, i) {
    const strong = sel && (i === sel || i === sel - 1);
    if (i === 0) {
      s += '<path d="M' + p[0] + "," + (p[1] - 13) + " L" + (p[0] + 11.5) + "," + (p[1] + 7) + " L" + (p[0] - 11.5) + "," + (p[1] + 7) + 'Z" fill="none" stroke="#a8236f" stroke-width="' + (strong ? 3 : 2) + '"/>';
    } else if (i === nCtl) {
      s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="9" fill="none" stroke="#a8236f" stroke-width="2"/><circle cx="' + p[0] + '" cy="' + p[1] + '" r="14" fill="none" stroke="#a8236f" stroke-width="2"/>';
    } else {
      s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="12" fill="none" stroke="#a8236f" stroke-width="' + (strong ? 3.2 : 2) + '"/>';
      if (!opts.noNumbers) s += '<text x="' + (p[0] + 15) + '" y="' + (p[1] - 10) + '" fill="#a8236f" font-size="13" font-weight="700" style="font-family:var(--font)">' + i + "</text>";
    }
  });
  return s + "</svg>";
}

function raceGrupo(race, legs) {

    let acc = 0;
    const r = rng(11 + k * 7);
    return legs.map(function (l) { acc += k === 1 ? -r() * 4 : (k === 0 ? -Math.max(0, l.loss) - r() * 3 : -r() * 14 - (r() > 0.85 ? 30 : 0)); return acc; });
  });

    lines({ labels: legs.map(function (l) { return String(l.n); }), series: series.map(function (v, i) { return { values: v, cls: "s" + (i + 1), name: names[i], thick: i === 0 }; }), endLabels: true, fmt: function (v) { return fnum(v, 0) + " s"; } }) + "</div></section></div>";
  return s;
}

      table: function () { return simpleTable(["Tramo", "Acumulado"], legs.map(function (l, i) { return [l.n, fnum(cum[i], 0) + " s"]; })); } },
    { id: "rc-p5", q: "Gano y pierdo", title: "Dónde gano y dónde pierdo", read: "Ganancia de cada tramo frente a lo esperado: arriba gano, abajo pierdo.",
      chart: function () { return columns({ labels: legs.map(function (l) { return String(l.n); }), values: legs.map(function (l) { return -l.loss; }), cls: function (v) { return v >= 0 ? "gain" : "err"; }, fmt: function (v) { return fnum(v, 0) + " s"; } }); },

      chart: function () { return columns({ labels: legs.map(function (l) { return String(l.n); }), values: legs.map(function (l) { return l.ir * 100; }), min: 0, ref: 100, refLabel: "100 %", cls: function (v, i) { return legs[i].err ? "err" : ""; }, fmt: function (v) { return fnum(v, 0) + " %"; } }); },
      table: function () { return simpleTable(["Tramo", "Rendimiento"], legs.map(function (l) { return [l.n, fpct(l.ir, 0)]; })); } },

}

  if (state.includeMe) rows.unshift({ id: "me", name: ME.name + " (tú)", races: 28, ir: 0.862, err: 0.151, loss: 6.7, common: "Salida de baliza", color: ME.color });
  let s = '<div class="page-head"><div class="grow"><h1>Comparar atletas</h1><p class="muted">Todos contra todos (P15), con los filtros del histórico.</p></div></div>';
  s += note("La vista de grupo de ahora, con <b>selector de grupo</b> (#120) y la casilla «Incluirme» (#119). Tres pestañas en vez de tres bloques seguidos. Comparar un grupo contra otro (#121) iría aquí más adelante.");
  s += '<div class="filterbar"><label for="g-sel">Grupo <select id="g-sel" class="select"><option value="all">Todos los atletas</option>' + GROUPS.map(function (g) { return '<option value="' + g.id + '"' + (state.groupSel === g.id ? " selected" : "") + ">" + g.name + "</option>"; }).join("") + '</select></label><label><input type="checkbox" id="includeMe"' + (state.includeMe ? " checked" : "") + '> Incluirme</label><label for="g-from">Desde <input id="g-from" class="input" type="date" value="2025-01-01"></label><label for="g-fmt">Formato <select id="g-fmt" class="select"><option>Todos</option><option>Sprint</option><option>Media</option><option>Larga</option></select></label></div>';
  const avg = function (k) { return rows.reduce(function (t, x) { return t + x[k]; }, 0) / rows.length; };
  s += '<div class="kpis">' + kpi("Atletas", rows.length, state.groupSel === "all" ? "todos" : GROUPS.find(function (g) { return g.id === state.groupSel; }).name) + kpi("Rendimiento medio", fpct(avg("ir")), "del grupo") + kpi("Tasa de error", fpct(avg("err")), "del grupo", "error") + kpi("Pérdida media", fnum(avg("loss")) + " %", "por tramo") + "</div>";
  s += '<div class="tabs">' + [["atletas", "Atletas"], ["h2h", "Cara a cara"], ["compartidas", "Carreras compartidas"]].map(function (t) { return '<button class="tab' + (state.groupTab === t[0] ? " on" : "") + '" data-gtab="' + t[0] + '">' + t[1] + "</button>"; }).join("") + "</div>";
  if (state.groupTab === "atletas") {
    s += '<section class="card"><div class="table-wrap"><table><thead><tr><th>Atleta</th><th class="r">Carreras</th><th class="r">Rendimiento</th><th class="r">Tasa de error</th><th class="r">Pérdida</th><th>Error más común</th></tr></thead><tbody>';
    rows.forEach(function (a) { s += '<tr tabindex="0" class="click"' + (a.id !== "me" ? ' data-go-athlete="' + a.id + '"' : "") + '><td><span class="row" style="gap:8px;flex-wrap:nowrap"><span class="avatar" style="width:26px;height:26px;font-size:10px;background:' + a.color + '">' + initials(a.name) + "</span><b>" + esc(a.name) + '</b></span></td><td class="r">' + a.races + '</td><td class="r">' + fpct(a.ir) + '</td><td class="r">' + fpct(a.err) + '</td><td class="r">' + fnum(a.loss) + " %</td><td>" + esc(a.common) + "</td></tr>"; });
    s += "</tbody></table></div></section>";
  } else if (state.groupTab === "h2h") {
    s += '<section class="card"><div class="table-wrap"><table class="h2h"><thead><tr><th></th>' + rows.map(function (a) { return '<th class="r">' + esc(a.name.split(" ")[0]) + "</th>"; }).join("") + "</tr></thead><tbody>";
    rows.forEach(function (a, i) {
      s += "<tr><th>" + esc(a.name) + "</th>";
      rows.forEach(function (b, j) {
        if (i === j) { s += '<td class="cell faint">—</td>'; return; }
        const r = rng((i + 1) * 17 + (j + 1) * 5);
        const w = Math.floor(r() * 5), l = Math.floor(r() * 5);
        s += '<td class="cell"><span class="' + (w > l ? "w" : w < l ? "l" : "") + '">' + w + "–" + l + '</span><div class="small faint">' + (w >= l ? "+" : "−") + fnum(r() * 6) + "</div></td>";
      });
      s += "</tr>";
    });
    s += '</tbody></table></div><p class="small muted" style="padding:10px 16px">En cada celda, cuántas carreras compartidas tuvo el de la fila más rendimiento que el de la columna y cuántas menos; debajo, la diferencia media en puntos.</p></section>';
  } else {
    s += '<section class="card"><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Carrera</th><th>De más a menos rendimiento</th></tr></thead><tbody>';
    RACES.slice(0, 6).forEach(function (x, k) {
      const order = rows.slice().sort(function () { return 0.5 - rng(k + 3)(); }).slice(0, 3 + (k % 3));
      s += '<tr><td class="muted num">' + fshort(x.date) + '</td><td class="race-name">' + esc(x.name) + "</td><td>" + order.map(function (a) { return esc(a.name.split(" ")[0]); }).join(" › ") + "</td></tr>";
    });
    s += "</tbody></table></div></section>";
  }
  return s;
}

// ---------- Perfil, ajustes y ayuda ----------
function viewPerfil() {
  let s = '<section class="card card-pad"><div class="row"><span class="avatar lg" style="background:' + ME.color + '">' + initials(ME.name) + '</span><div class="stack" style="gap:2px;flex:1"><h1>' + ME.name + '</h1><span class="muted">' + ME.club + " · " + ME.cat + '</span></div><button class="btn">Editar</button></div></section>';
  s += note("<b>Mi perfil</b> junta quién eres (para encontrarte en los resultados) y qué compartes. Lo técnico de verdad (umbrales, zona horaria) se va a Ajustes.");
  s += '<div class="grid-2"><section class="card card-pad form-section"><h2>Quién soy</h2><div class="field"><label for="p-name">Nombre y apellidos</label><input id="p-name" class="input" value="' + ME.name + '"><span class="hint">Tal y como sale en los resultados. Sirve para encontrarte en el .spl.</span></div><div class="field"><label for="p-si">Tarjeta SI</label><input id="p-si" class="input" value="' + ME.si + '"></div><div class="field"><label for="p-club">Club</label><input id="p-club" class="input" value="' + ME.club + '"></div></section>';
  s += '<section class="card card-pad form-section"><h2>Qué comparto</h2><div class="field"><label for="p-share">Por defecto, de cada carrera</label><select id="p-share" class="select"><option>Tramos</option><option>Nada</option><option>Solo el resumen</option><option>Track completo</option></select><span class="hint">Se puede cambiar en cada carrera.</span></div><div class="field"><label>Carpeta compartida</label><div class="row"><span class="pill pill-ok">Conectada</span><span class="small muted">~/Drive/Club/tramos</span><button class="btn btn-sm">Cambiar</button></div></div><div class="kpis"><div class="kpi"><span class="label">Carreras compartidas</span><span class="value">26</span></div><div class="kpi"><span class="label">Sin compartir</span><span class="value">2</span></div></div></section></div>';
  return s;
}
function viewAjustes() {
  const sec = state.settingsSection;
  const sections = [["analisis", "Análisis"], ["importacion", "Importación"], ["mapa", "Colores del mapa"], ["entrenar", "Entrenar"], ["apariencia", "Apariencia y vistas"]];
  let s = '<div class="page-head"><div class="grow"><h1>Ajustes</h1><p class="muted">Se guardan al momento.</p></div></div>';
  s += '<div class="settings"><nav class="settings-nav" aria-label="Secciones de ajustes">' + sections.map(function (x) { return '<button class="' + (sec === x[0] ? "on" : "") + '" data-sset="' + x[0] + '">' + x[1] + "</button>"; }).join("") + '</nav><section class="card card-pad form-section">';
  if (sec === "analisis") s += '<h2>Análisis</h2><p class="muted small">Cuándo un tramo cuenta como error. Cambiarlo recalcula todas las vistas.</p><div class="grid-2"><div class="field"><label for="s-th">Pérdida mínima (s)</label><input id="s-th" class="input" value="15"></div><div class="field"><label for="s-pct">Pérdida mínima (% de lo esperado)</label><input id="s-pct" class="input" value="10"></div></div>';
  if (sec === "importacion") s += '<h2>Importación</h2><div class="field"><label for="s-tz">Zona horaria de las carreras</label><select id="s-tz" class="select"><option>Europe/Madrid</option><option>Atlantic/Canary</option></select><span class="hint">Solo para las carreras que importes a partir de ahora.</span></div>';
  if (sec === "mapa") {
    s += '<h2>Colores del mapa</h2><p class="muted small">Tus zonas de ritmo y pulso para colorear el track. Sin zonas, se usan cinco tonos por carrera.</p>';
    [["Hasta 4:30", "#6da7ec"], ["4:30 – 5:30", "#3987e5"], ["5:30 – 6:30", "#256abf"], ["6:30 – 8:00", "#184f95"], ["Más de 8:00", "#0d366b"]].forEach(function (z) { s += '<div class="zone-row"><span class="zone-sw" style="background:' + z[1] + '"></span><span class="num">' + z[0] + ' min/km</span></div>'; });
  }
  if (sec === "entrenar") {
    s += '<h2>Entrenar</h2><label class="switch"><input type="checkbox" id="coachToggle"' + (state.coachEnabled ? " checked" : "") + '><span><b>Entreno a otros atletas</b><br><span class="muted small">Añade la sección Atletas al menú. Tus carreras siguen igual.</span></span></label>';
    s += '<label class="switch"><input type="checkbox" checked><span><b>Compartir mis carreras</b><br><span class="muted small">Con quien te entrena, por la carpeta compartida.</span></span></label>';
  }
  if (sec === "apariencia") s += '<h2>Apariencia y vistas</h2><div class="field"><label>Tema</label><div class="seg"><button class="' + (state.theme === "system" ? "on" : "") + '" data-theme-set="system">Sistema</button><button class="' + (state.theme === "light" ? "on" : "") + '" data-theme-set="light">Claro</button><button class="' + (state.theme === "dark" ? "on" : "") + '" data-theme-set="dark">Oscuro</button></div></div><div class="field"><label>Paneles ocultos</label><span class="hint">Has ocultado ' + Object.keys(state.hidden).filter(function (k) { return state.hidden[k]; }).length + ' paneles en Estadísticas y en las carreras.</span><div class="row"><button class="btn btn-sm" data-act="customize">Elegir paneles</button><button class="btn btn-sm btn-ghost" data-act="reset-hidden">Enseñar todos</button></div></div>';
  return s + "</section></div>";
}
function viewAyuda() {
  let s = '<div class="page-head"><div class="grow"><h1>Ayuda</h1><p class="muted">Contenido de #125. Aquí solo se ve dónde vive.</p></div><div class="search">' + icon("search", 16) + '<input class="input" placeholder="Buscar en la ayuda"></div></div>';
  s += '<div class="grid-3">' + [["Primeros pasos", "Importar tu primera carrera, añadir el FIT y revisar los errores."], ["Conceptos", "Tiempo perdido, rendimiento, referencia, consistencia y tipos de error, con ejemplos."], ["Cada pantalla", "Qué enseña cada vista y cada panel, y cómo leerlo."], ["Compartir", "La carpeta compartida, qué ve tu entrenador y cómo dejar de compartir."], ["Entrenar", "Atletas, grupos y comparaciones."], ["Privacidad", "Qué datos se guardan y dónde."]].map(function (x) { return '<section class="card card-pad stack"><h3>' + x[0] + '</h3><p class="muted small">' + x[1] + "</p></section>"; }).join("") + "</div>";
  return s;
}

// ---------- Bienvenida ----------
function viewOnboarding() {
  return '<div class="onboard"><div class="onboard-card"><div class="stack" style="justify-items:center">' + baliza(48) + '<h1>Te damos la bienvenida a Tramos</h1><p class="muted">¿Cómo vas a usar la app? Lo puedes cambiar luego en Ajustes.</p></div><div class="role-grid">' +
    [["run", "Corro", "Analizo mis carreras."], ["whistle", "Entreno", "Veo las carreras de mis atletas."], ["users", "Las dos cosas", "Corro y además entreno a otros."]].map(function (x, i) {
      return '<button class="card role" data-role-pick="' + (i === 0 ? "runner" : "both") + '"><span class="ico">' + icon(x[0], 26) + "</span><b>" + x[1] + '</b><span class="small muted">' + x[2] + "</span></button>";
    }).join("") + '</div><p class="small faint">Boceto: «Entreno» y «Las dos cosas» llevan aquí al mismo sitio, con tus carreras vacías si solo entrenas.</p></div></div>';
}

// ---------- Panel del boceto y personalizar ----------
function mockPanel() {
  let s = '<button class="mock-fab" data-act="mock">' + (state.mockOpen ? "Cerrar boceto" : "Boceto") + "</button>";
  if (!state.mockOpen) return s;
  s += '<aside class="mock-panel" aria-label="Opciones del boceto"><div class="stack" style="gap:4px"><h3>Boceto de navegación (#105 y #119)</h3><p class="small muted">Datos inventados. Ningún nombre, carrera ni número es real. Los botones de importar, guardar o etiquetar no hacen nada.</p></div>';
  s += '<div class="field"><label>Cómo usas la app</label><div class="seg"><button class="' + (state.role === "runner" ? "on" : "") + '" data-role="runner">Corro</button><button class="' + (state.role === "both" ? "on" : "") + '" data-role="both">Corro y entreno</button></div></div>';
  s += '<div class="field"><label>Estadísticas</label><div class="seg"><button class="' + (state.statsLayout === "tabs" ? "on" : "") + '" data-layout="tabs">Pestañas</button><button class="' + (state.statsLayout === "index" ? "on" : "") + '" data-layout="index">Índice lateral</button></div></div>';
  s += '<div class="field"><label>Tema</label><div class="seg"><button class="' + (state.theme === "system" ? "on" : "") + '" data-theme-set="system">Sistema</button><button class="' + (state.theme === "light" ? "on" : "") + '" data-theme-set="light">Claro</button><button class="' + (state.theme === "dark" ? "on" : "") + '" data-theme-set="dark">Oscuro</button></div></div>';
  s += '<label class="row small" style="gap:8px"><input type="checkbox" id="notesToggle"' + (state.notes ? " checked" : "") + "> Enseñar las notas de diseño (amarillas)</label>";
  s += '<button class="btn btn-sm" data-act="onboarding">Ver la bienvenida de la primera vez</button>';
  return s + "</aside>";
}
function drawer() {
  if (!state.drawer) return "";
  const all = statPanels();
  let s = '<div class="drawer-bg" data-act="close-drawer"></div><aside class="drawer" aria-label="Personalizar"><div class="row"><h2 style="flex:1">Personalizar</h2><button class="icon-btn" data-act="close-drawer" aria-label="Cerrar">' + icon("close") + "</button></div>";
  s += '<p class="muted small">Elige qué paneles ves. Se guarda para ti y vale para todas tus carreras y para las de tus atletas.</p>';
  STAT_TABS.forEach(function (t) {
    s += '<div class="stack" style="gap:6px"><span class="eyebrow">Estadísticas · ' + t.label + "</span>";
    all[t.id].forEach(function (p) { s += '<label class="check-row"><input type="checkbox" data-toggle-panel="' + p.id + '"' + (state.hidden[p.id] ? "" : " checked") + '><span class="grow">' + p.title + '</span><span class="faint small">' + p.q + "</span></label>"; });
    s += "</div>";
  });
  s += '<div class="stack" style="gap:6px"><span class="eyebrow">Carrera · Análisis</span>' + [["rc-p3", "Pérdida acumulada"], ["rc-p5", "Dónde gano y dónde pierdo"], ["rc-ir", "Rendimiento por tramo"], ["rc-p2", "¿De qué está hecha la pérdida?"]].map(function (p) { return '<label class="check-row"><input type="checkbox" data-toggle-panel="' + p[0] + '"' + (state.hidden[p[0]] ? "" : " checked") + '><span class="grow">' + p[1] + "</span></label>"; }).join("") + "</div>";
  s += '<div class="row"><button class="btn btn-primary" data-act="close-drawer">Hecho</button><button class="btn btn-ghost" data-act="reset-hidden">Enseñar todos</button></div></aside>';
  return s;
}

// ======================================================================
// Render y eventos
// ======================================================================
const root = document.getElementById("root");
function applyTheme() {
  if (state.theme === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", state.theme);
  document.body.classList.toggle("no-notes", !state.notes);
}
function render() {
  applyTheme();
  if (state.onboarding) { root.innerHTML = viewOnboarding() + mockPanel(); return; }
  const r = state.route;
  const views = { inicio: viewInicio, carreras: viewCarreras, carrera: viewCarrera, estadisticas: viewEstadisticas, importar: viewImportar, atletas: viewAtletas, atleta: viewAtleta, grupo: viewGrupo, perfil: viewPerfil, ajustes: viewAjustes, ayuda: viewAyuda };
  let body = (views[r.name] || viewInicio)();
  root.innerHTML = '<div class="shell">' + sidebar() + '<div class="main">' + topbar() + '<main class="content">' + body + "</main></div></div>" + mockPanel() + drawer();
}

root.addEventListener("click", function (ev) {
  const t = ev.target.closest("button, tr[data-race], tr[data-leg], tr[data-go-athlete], [data-act]");
  if (!t) { if (state.openMenu) { state.openMenu = null; render(); } return; }
  const d = t.dataset;
  const athlete = state.route.athlete;
  if (d.go) { go({ name: d.go, athlete: d.keepAthlete ? athlete : undefined }); return; }
  if (d.goAthlete) { go({ name: "atleta", athlete: d.goAthlete }); return; }
  if (d.route) { go(JSON.parse(d.route)); return; }
  if (d.race) { go({ name: "carrera", id: d.race, tab: d.tab || "resumen", athlete: athlete }); return; }
  if (d.rtab) { state.route = Object.assign({}, state.route, { tab: d.rtab }); render(); return; }
  if (d.stab) { state.route = Object.assign({}, state.route, { tab: d.stab }); render(); return; }
  if (d.mapleg) { state.selLeg = Number(d.mapleg); state.route = Object.assign({}, state.route, { tab: "mapa" }); render(); return; }
  if (d.leg != null) { const n = Number(d.leg); state.selLeg = n === 0 || state.selLeg === n ? null : n; render(); return; }
  if (d.format) { state.list.format = d.format; state.list.page = 1; render(); return; }
  if (d.page) { const p = Number(d.page); if (p >= 1) { state.list.page = p; render(); } return; }
  if (d.view) { state.viewTable[d.view] = d.as === "table"; render(); return; }
  if (d.menu) { state.openMenu = state.openMenu === d.menu ? null : d.menu; render(); return; }
  if (d.hide) { state.hidden[d.hide] = true; store.set("hidden", state.hidden); state.openMenu = null; render(); return; }
  if (d.metric) { state.mapMetric = d.metric; render(); return; }
  if (d.agroup) { state.athleteFilter.group = d.agroup; render(); return; }
  if (d.atab) { state.athletesTab = d.atab; render(); return; }
  if (d.gtab) { state.groupTab = d.gtab; render(); return; }
  if (d.itab) { state.importTab = d.itab; render(); return; }
  if (d.sset) { state.settingsSection = d.sset; render(); return; }
  if (d.groupStats) { state.groupSel = d.groupStats; go({ name: "grupo" }); return; }
  if (d.toc) { const el = document.getElementById(d.toc); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); document.querySelectorAll(".toc button").forEach(function (b) { b.classList.toggle("on", b === t); }); return; }
  if (d.role) { state.role = d.role; state.coachEnabled = d.role === "both"; store.set("role", d.role); if (!state.coachEnabled && (viewing() || ["atletas", "grupo", "atleta"].indexOf(state.route.name) >= 0)) state.route = { name: "inicio" }; render(); return; }
  if (d.rolePick) { state.role = d.rolePick; state.coachEnabled = d.rolePick === "both"; state.onboarding = false; state.route = { name: "inicio" }; render(); return; }
  if (d.layout) { state.statsLayout = d.layout; store.set("statsLayout", d.layout); render(); return; }
  if (d.themeSet) { state.theme = d.themeSet; store.set("theme", d.themeSet); render(); return; }
  if (d.act === "back") { back(); return; }
  if (d.act === "side") { state.sideOpen = !state.sideOpen; render(); return; }
  if (d.act === "mock") { state.mockOpen = !state.mockOpen; store.set("mockOpen", state.mockOpen); render(); return; }
  if (d.act === "onboarding") { state.onboarding = true; state.mockOpen = false; render(); return; }
  if (d.act === "customize") { state.drawer = true; state.openMenu = null; render(); return; }
  if (d.act === "close-drawer") { state.drawer = null; render(); return; }
  if (d.act === "reset-hidden") { state.hidden = {}; store.set("hidden", state.hidden); render(); return; }
  if (d.act === "clear-filters") { state.list = { q: "", format: "all", season: "all", trackOnly: false, sort: "recent", page: 1 }; render(); return; }
});
root.addEventListener("change", function (ev) {
  const t = ev.target;
  if (t.id === "season") { state.list.season = t.value; state.list.page = 1; render(); }
  else if (t.id === "sort") { state.list.sort = t.value; render(); }
  else if (t.id === "trackOnly") { state.list.trackOnly = t.checked; state.list.page = 1; render(); }
  else if (t.id === "onlyErrors") { state.onlyErrors = t.checked; render(); }
  else if (t.id === "g-sel") { state.groupSel = t.value; render(); }
  else if (t.id === "includeMe") { state.includeMe = t.checked; render(); }
  else if (t.id === "notesToggle") { state.notes = t.checked; store.set("notes", state.notes); applyTheme(); }
  else if (t.id === "coachToggle") { state.coachEnabled = t.checked; state.role = t.checked ? "both" : "runner"; store.set("role", state.role); render(); }
  else if (t.dataset.togglePanel) { state.hidden[t.dataset.togglePanel] = !t.checked; store.set("hidden", state.hidden); render(); }
});
let typing = null;
root.addEventListener("input", function (ev) {
  const t = ev.target;
  if (t.id !== "q" && t.id !== "aq") return;
  clearTimeout(typing);
  typing = setTimeout(function () {
    if (t.id === "q") { state.list.q = t.value; state.list.page = 1; } else state.athleteFilter.q = t.value;
    const id = t.id, pos = t.selectionStart;
    render();
    const el = document.getElementById(id);
    if (el) { el.focus(); el.setSelectionRange(pos, pos); }
  }, 200);
});
document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape") { if (state.drawer) { state.drawer = null; render(); } else if (state.openMenu) { state.openMenu = null; render(); } }
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches("tr.click")) { ev.preventDefault(); ev.target.click(); }
});
render();
</script>
</body>
</html>
